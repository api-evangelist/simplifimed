  virtual assistant for medical and physician practices, automating patient communication
  and front-office administrative workflows such as messaging, appointment scheduling,
  and intake in order to reduce staff workload and streamline clinic operations. It
  is an early-stage company backed by 500 Global. During enrichment no public API,
  developer portal, documentation, SDKs, or GitHub organization were discoverable; the
  marketing site is served behind a bot-challenge wall, so only infrastructure-level
  security signals could be probed.
